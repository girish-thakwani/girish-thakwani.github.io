- title: Research Projects
  type: time_table
  contents:
    - title: "Outcome-Aware Fine-Tuning of Vision-Language Models for Web Agents"
      institution: Carnegie Mellon University (CMU), Pittsburgh, PA
      logo: /assets/img/logos/cmu.png
      year: Jan 2026 – May 2026
      description:
        - "Ran a controlled study isolating outcome supervision for web agents: LoRA fine-tuned Qwen3-VL-8B on 6,445 matched Multimodal Mind2Web examples, nearly doubling Step Success Rate over the zero-shot baseline (31.99% to 62.32%)."
        - "Showed that adding structured page-transition labels to the training target gave no measurable gain over action-only SFT (task-level 95% CIs overlap), a null result that replicated across all three test splits."
        - "Traced the regression to a terminal-action bias (predicting a child click over the parent hover) through dataset, schema, and failure-case analysis, supported by AXTree and chain-of-thought ablations."
    - title: "Cross-Lingual Hallucination Detection in Multilingual LLMs"
      institution: Carnegie Mellon University (CMU), Pittsburgh, PA
      logo: /assets/img/logos/cmu.png
      year: Sep 2025 – Dec 2025
      description:
        - "Tested whether correctness probes trained only on English hidden states of Qwen2.5-7B-Instruct can flag hallucinations zero-shot in Chinese, Thai, Vietnamese, and Indonesian; best probe reached 0.704 AUC on English and 0.64 to 0.68 across target languages with no target-language supervision."
        - "Ran a full 28-layer sweep across six probe families and two extraction points, showing post-answer features and deeper layers transfer best and that the correctness signal is low-dimensional (random forests within 0.01 AUC of the MLP)."
        - "Traced the dominant failure to confident hallucinations the hidden state does not expose, and to conflating knowledge absence with hallucination, motivating a three-way correct/uncertain/hallucinating labeling scheme."
    - title: "PRISM: Probing Routed Information Flow via Structured Multimodal Bottlenecks"
      institution: Carnegie Mellon University (CMU), Pittsburgh, PA
      logo: /assets/img/logos/cmu.png
      year: Sep 2025 – Dec 2025
      description:
        - "Designed & validated hierarchical fusion variant outperforming symmetric design by +2.7% (Acc2/F1); identified asymmetric (AV/VA) fusion matches symmetric performance with fewer parameters; a key insight for production multimodal model design."
        - "Researched fusion efficiency in multimodal models; discovered that scaling fusion capacity (4 to 12 tokens) on CMU-MOSEI/MOSI hurts performance (-6% correlation), revealing architectural waste."
    - title: "ScleraNext: Lightweight CNN Segmentation for Real-Time Biometric Identification"
      institution: University of Ljubljana (UL), Ljubljana, Slovenia (Remote)
      logo:
      year: Jun 2021 – Dec 2021
      description:
        - "Optimized production iris/retinal segmentation pipeline: replaced cascaded 2-stage segmentation CNN with single compact model, reducing inference latency by 73% for edge deployment."
        - "Benchmarked YOLO, U-Net, MobileNet, DenseNet on accuracy/latency tradeoffs and selected optimal U-net based model."
    - title: "GraphAct: Graph-Structured Action Prediction for Web Agents"
      institution: Carnegie Mellon University (CMU), Pittsburgh, PA
      logo: /assets/img/logos/cmu.png
      year: Sep 2025 – Dec 2025
      description:
        - "Identified element grounding, not action prediction, as the core failure mode on Multimodal Mind2Web, then fused a DOM graph attention network into a frozen Qwen3-VL-8B backbone via a gated cross-attention adapter and LoRA, all within a single 24GB GPU."
        - "Lifted element accuracy from 12.7% (no graph) to 49.5% and beat the strongest multimodal baseline by ~12 points with step accuracy reaching ~41%; showed these gains did not fully reach task success (7.75%) due to error accumulation over long trajectories."
        - "Traced fixation and anchor-bias failures to the static per-step graph and fragile node pruning, and proposed dynamic node masking and topology-aware retention as fixes."

